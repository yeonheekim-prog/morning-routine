<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Nick 아침 루틴</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23f2f2f2' stroke='%23111' stroke-width='6'/%3E%3Cpath d='M4 50a46 46 0 0 1 92 0z' fill='%23ff4d5a' stroke='%23111' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='13' fill='%23fff' stroke='%23111' stroke-width='6'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b1020; --panel:rgba(20,27,47,.80); --panel2:#1b2440; --line:#28324f;
  --text:#eef2ff; --muted:#8e99ba; --red:#ff4d5a; --yellow:#ffcb3d;
  --green:#3ddc97; --blue:#5aa9ff; --purple:#a78bfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow-x:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{display:grid;grid-template-rows:auto auto 1fr;gap:14px;padding:16px 18px 18px;min-height:100vh;max-width:1600px;margin:0 auto}

/* ── 헤더 ── */
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.clock{font-size:clamp(44px,6vw,76px);font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
.date{color:var(--muted);font-size:18px;font-weight:600;line-height:1.35}
.date b{color:var(--text);font-size:22px}
header .spacer{margin-left:auto}
/* ── 등교까지 남은 시간 (크게) ── */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 24px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 28px;align-items:center}
.hero .lbl{font-size:clamp(20px,2.2vw,28px);color:var(--muted);font-weight:800;grid-column:1}
.hero .val{grid-column:1;font-size:clamp(84px,12vw,170px);font-weight:900;font-variant-numeric:tabular-nums;line-height:.95;letter-spacing:-3px;transition:color .5s}
.hero.warn .val{color:var(--yellow)} .hero.hot .val{color:var(--red);animation:pulse 1s ease-in-out infinite} .hero.ok .val{color:var(--green)}
.hero .tl{grid-column:2;grid-row:1 / span 2;align-self:center;min-width:0}
@keyframes pulse{50%{opacity:.6}}
@media (max-width:720px){ .hero{grid-template-columns:1fr} .hero .tl{grid-column:1;grid-row:auto} }
.iconbtn{width:52px;height:52px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:24px}
.iconbtn.on{border-color:var(--green);box-shadow:0 0 0 2px rgba(61,220,151,.25) inset}

/* ── 타임라인 ── */
.timeline{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 18px}
.tl-top{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);font-weight:700;margin-bottom:8px}
.pace{padding:4px 12px;border-radius:999px;font-size:15px;font-weight:800}
.pace.good{background:rgba(61,220,151,.15);color:var(--green)}
.pace.bad{background:rgba(255,203,61,.15);color:var(--yellow)}
.pace.idle{background:rgba(142,153,186,.15);color:var(--muted)}
.bar{position:relative;height:16px;background:var(--panel2);border-radius:999px;overflow:hidden}
.bar .time{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3b4a7a,#5a6aa0);border-radius:999px;transition:width 1s linear}
.bar .tdone{position:absolute;inset:4px auto 4px 0;background:var(--red);border-radius:999px;transition:width .5s}
.tl-legend{display:flex;gap:16px;margin-top:6px;font-size:13px;color:var(--muted)}
.tl-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ── 본문 그리드 ── */
.grid{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:14px;min-height:0}
.card,.hero{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 18px;min-width:0}
.card h2{margin:0 0 12px;font-size:17px;letter-spacing:.5px;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 .sub{margin-left:auto;font-size:15px;color:var(--text)}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

/* 루틴 */
.tasks{display:flex;flex-direction:column;gap:9px}
.task{display:flex;align-items:center;gap:14px;background:var(--panel2);border:2px solid transparent;border-radius:16px;padding:10px 14px;min-height:72px;text-align:left;width:100%;transition:transform .1s,border-color .2s}
.task:active{transform:scale(.98)}
.task.now{border-color:var(--blue)}
.task.late{border-color:var(--yellow)}
.task.done{background:#152a26}
.task .tm{font-size:15px;color:var(--muted);font-weight:800;width:52px;font-variant-numeric:tabular-nums}
.task .nm{flex:1;font-size:21px;font-weight:700}
.task.done .nm{color:#9fb9ad;text-decoration:line-through;text-decoration-thickness:2px}
.task{cursor:pointer}
.undo{flex:none;padding:10px 14px;border-radius:12px;background:#24344a;color:#cfe3ff;font-size:15px;font-weight:800;white-space:nowrap}
.undo:active{background:#33507a}
.stamp{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px dashed #3a4670;position:relative}
.stamp img{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.task.done .stamp{border:2px solid var(--green);background:radial-gradient(circle,#1f3d36,#152a26)}
.stamp .shiny{position:absolute;top:-6px;right:-6px;font-size:16px}
.allclear{margin-top:10px;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,rgba(255,77,90,.2),rgba(255,203,61,.2));font-weight:800;font-size:17px;display:none;align-items:center;gap:12px}
.allclear.show{display:flex}
.allclear img{width:54px;height:54px}

/* 확언 */
.affirm .ko{font-size:clamp(22px,2.3vw,30px);font-weight:800;line-height:1.4;word-break:keep-all}
.affirm .en{margin-top:8px;font-size:clamp(16px,1.6vw,20px);color:var(--blue);font-weight:600;font-style:italic}

/* 준비물 */
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--panel2);border-radius:14px;padding:11px 14px;font-size:19px;font-weight:700;width:100%;text-align:left}
.item .box{width:28px;height:28px;border-radius:8px;border:2px solid #4a5684;display:grid;place-items:center;flex:none;font-size:18px}
.item.done{color:#8fa59b}
.item.done .box{background:var(--green);border-color:var(--green);color:#0b1020}
.item .tag{margin-left:auto;font-size:12px;padding:3px 8px;border-radius:999px;background:#2b3558;color:var(--muted);font-weight:800}
.item .tag.today{background:rgba(255,77,90,.2);color:#ff8f97}
.item .tag.wx{background:rgba(90,169,255,.18);color:var(--blue)}
.empty{color:var(--muted);font-size:16px;padding:6px 2px}

/* 날씨 */
.wx-main{display:flex;align-items:center;gap:14px}
.wx-ic{font-size:54px;line-height:1}
.wx-t{font-size:44px;font-weight:900;line-height:1}
.wx-d{color:var(--muted);font-size:15px;font-weight:600;margin-top:4px}
.wx-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{background:var(--panel2);border-radius:10px;padding:7px 10px;font-size:14px;font-weight:700}
.chip b{font-size:16px}

/* 도감 */
.dex-strip{display:flex;gap:6px;flex-wrap:wrap}
.dex-strip .mon{width:52px;height:52px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;position:relative}
.dex-strip img{width:50px;height:50px;object-fit:contain}
.dex-strip .mon.leg{box-shadow:0 0 0 2px var(--yellow) inset}
.dexbtn{margin-top:10px;width:100%;padding:11px;border-radius:12px;background:var(--panel2);font-weight:800;font-size:16px}

/* 오버레이 */
.ov{position:fixed;inset:0;background:rgba(5,8,18,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.show{display:flex}
.reveal{text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.reveal .ball{width:110px;height:110px;margin:0 auto;animation:shake .5s ease-in-out 2}
.reveal img{width:min(300px,60vw);height:min(300px,60vw);object-fit:contain;filter:drop-shadow(0 8px 30px rgba(90,169,255,.5))}
.reveal .rk{font-size:15px;font-weight:800;color:var(--yellow);letter-spacing:2px}
.reveal .nm{font-size:44px;font-weight:900;margin-top:4px}
.reveal .en{color:var(--muted);font-size:18px;font-weight:700}
.reveal .types{margin-top:10px;display:flex;gap:6px;justify-content:center}
.reveal .types span{padding:4px 12px;border-radius:999px;font-weight:800;font-size:15px;background:#2b3558}
.reveal .hint{margin-top:18px;color:var(--muted);font-size:15px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}

.sheet{background:var(--panel);border:1px solid var(--line);border-radius:22px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:22px;user-select:text;-webkit-user-select:text}
.sheet h3{margin:0 0 4px;font-size:22px}
.sheet .row{margin-top:16px}
.sheet label{display:block;font-size:14px;color:var(--muted);font-weight:800;margin-bottom:6px}
.sheet input[type=text],.sheet input[type=time],.sheet textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
.sheet textarea{min-height:170px;line-height:1.6}
.sheet .two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sheet .week{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center}
.sheet .week span{font-weight:800;text-align:center}
.sheet .help{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.switch{display:flex;align-items:center;gap:12px;background:var(--panel2);border-radius:14px;padding:14px;width:100%;text-align:left;font-weight:800;font-size:17px}
.switch .k{margin-left:auto;width:54px;height:30px;border-radius:999px;background:#3a4466;position:relative;transition:.2s;flex:none}
.switch .k::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch.on .k{background:var(--green)} .switch.on .k::after{left:27px}
.wakeinfo{font-size:14px;margin-top:8px;line-height:1.55;color:var(--muted)}
.wakeinfo.ok{color:var(--green)} .wakeinfo.bad{color:var(--yellow)}
.btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:13px 20px;border-radius:12px;background:var(--panel2);font-weight:800;font-size:16px}
.btn.pri{background:var(--red);color:#fff}
.btn.ghost{color:var(--muted)}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:14px}
.dexgrid .m{background:var(--panel2);border-radius:14px;padding:6px;text-align:center;font-size:13px;font-weight:700}
.dexgrid img{width:80px;height:80px;object-fit:contain}
.dexgrid .c{color:var(--muted);font-size:12px}

/* ── 소리 알림 배너 ── */
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);z-index:60;padding:18px 28px;border-radius:18px;font-size:clamp(22px,2.6vw,32px);font-weight:900;box-shadow:0 12px 40px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.five{background:var(--red);color:#fff}
.toast.late{background:var(--yellow);color:#1a1300}
.soundrow{display:flex;gap:10px;margin-top:10px}

/* ── 날씨 배경 ── */
#sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);transition:background 1.5s}
#sky::before,#sky::after{content:"";position:absolute;inset:0;pointer-events:none}
#sky.sun{background:radial-gradient(circle at 86% 6%,rgba(255,214,102,.55) 0,rgba(255,170,60,.22) 14%,transparent 38%),linear-gradient(180deg,#14427a 0%,#0d2347 55%,#0b1020 100%)}
#sky.sun::before{background:radial-gradient(circle at 86% 6%,#ffe58f 0 5%,transparent 5.6%);animation:glow 5s ease-in-out infinite}
#sky.cloud{background:linear-gradient(180deg,#34415f 0%,#1a2238 60%,#0b1020 100%)}
#sky.cloud::before,#sky.rain::before{background:
  radial-gradient(ellipse 24% 9% at 18% 12%,rgba(210,220,240,.24),transparent 70%),
  radial-gradient(ellipse 30% 11% at 68% 7%,rgba(210,220,240,.20),transparent 70%),
  radial-gradient(ellipse 22% 8% at 45% 24%,rgba(210,220,240,.15),transparent 70%),
  radial-gradient(ellipse 26% 9% at 90% 30%,rgba(210,220,240,.12),transparent 70%);
  animation:drift 40s ease-in-out infinite alternate}
#sky.rain{background:linear-gradient(180deg,#26324a 0%,#121a2b 60%,#0b1020 100%)}
#sky.rain::after,#sky.storm::after{background-image:repeating-linear-gradient(100deg,transparent 0 22px,rgba(170,200,255,.20) 22px 23px,transparent 23px 52px);
  background-size:260px 260px;animation:rain .45s linear infinite}
#sky.storm{background:linear-gradient(180deg,#221d3d 0%,#100e20 70%,#0b1020 100%)}
#sky.storm::before{animation:flash 8s infinite}
#sky.fog{background:linear-gradient(180deg,#3a4458 0%,#1b2236 65%,#0b1020 100%)}
#sky.fog::before{background:linear-gradient(180deg,rgba(200,208,225,.22),transparent 55%);animation:glow 8s ease-in-out infinite}
@keyframes glow{50%{opacity:.65}}
@keyframes drift{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
@keyframes rain{from{background-position:0 0}to{background-position:-46px 260px}}
@keyframes flash{0%,90%,100%{background:transparent}91%{background:rgba(225,232,255,.28)}92%{background:transparent}93.5%{background:rgba(225,232,255,.16)}95%{background:transparent}}
@media (prefers-reduced-motion:reduce){#sky::before,#sky::after{animation:none}}

/* 세로 화면·작은 화면 */
@media (max-width:1100px){ .grid{grid-template-columns:1fr 1fr} .grid>.col:last-child{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr} }
@media (max-width:720px){ .grid{grid-template-columns:1fr} .grid>.col:last-child{grid-template-columns:1fr} .count{margin-left:0;width:100%;text-align:left} .sheet .two{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="sky"></div>
<div class="toast" id="toast"></div>
<div class="app">
  <header>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
    <span class="spacer"></span>
    <button class="iconbtn" id="wakeBtn" title="화면 꺼짐 방지">💡</button>
    <button class="iconbtn" id="fsBtn" title="전체 화면">⛶</button>
    <button class="iconbtn" id="setBtn" title="설정">⚙️</button>
  </header>

  <section class="hero" id="count">
    <div class="lbl" id="countLbl"></div>
    <div class="val" id="countVal">--</div>
    <div class="tl">
      <div class="tl-top"><span id="tlRange"></span><span class="pace idle" id="pace">대기 중</span></div>
      <div class="bar"><div class="time" id="barTime"></div><div class="tdone" id="barTask"></div></div>
      <div class="tl-legend"><span><i style="background:#5a6aa0"></i>흐른 시간</span><span><i style="background:var(--red)"></i>끝낸 루틴</span></div>
    </div>
  </section>

  <main class="grid">
    <div class="col">
      <section class="card">
        <h2>🎯 오늘의 미션 <span class="sub" id="taskCount"></span></h2>
        <div class="tasks" id="tasks"></div>
        <div class="allclear" id="allclear"><img id="bonusImg" alt=""><div id="bonusTxt"></div></div>
      </section>
    </div>
    <div class="col">
      <section class="card">
        <h2>🎒 오늘 챙길 것 <span class="sub" id="itemCount"></span></h2>
        <div class="items" id="items"></div>
      </section>
      <section class="card" id="wxCard">
        <h2>🌤 West End 날씨 <span class="sub" id="wxUpd"></span></h2>
        <div id="wx"><div class="empty">날씨 불러오는 중…</div></div>
      </section>
    </div>
    <div class="col">
      <section class="card affirm">
        <h2>💬 오늘의 한마디</h2>
        <div class="ko" id="affKo"></div>
        <div class="en" id="affEn"></div>
      </section>
      <section class="card">
        <h2>📘 내 도감 <span class="sub" id="dexCount"></span></h2>
        <div class="dex-strip" id="dexStrip"></div>
        <button class="dexbtn" id="dexBtn">도감 전체 보기</button>
      </section>
    </div>
  </main>
</div>

<!-- 포켓몬 획득 -->
<div class="ov" id="revealOv"><div class="reveal" id="reveal"></div></div>

<!-- 도감 -->
<div class="ov" id="dexOv"><div class="sheet">
  <h3>📘 Nick의 도감</h3>
  <div class="help" id="dexSum"></div>
  <div class="dexgrid" id="dexGrid"></div>
  <div class="btns"><button class="btn pri" data-close="dexOv">닫기</button></div>
</div></div>

<!-- 설정 -->
<div class="ov" id="setOv"><div class="sheet">
  <h3>⚙️ 설정</h3>
  <div class="row">
    <button class="switch" id="wakeSw"><span>💡 화면 꺼짐 방지</span><span class="k"></span></button>
    <div class="wakeinfo" id="wakeInfo"></div>
  </div>
  <div class="row">
    <button class="switch" id="soundSw"><span>🔔 소리 알림 (출발 5분 전 · 미션 밀릴 때)</span><span class="k"></span></button>
    <div class="soundrow"><button class="btn" id="testFive">5분 전 소리 듣기</button><button class="btn" id="testLate">밀림 소리 듣기</button></div>
    <div class="wakeinfo">태블릿 소리를 켜 두세요. 페이지를 연 뒤 화면을 한 번 터치해야 소리가 나요(브라우저 규칙).</div>
  </div>
  <div class="row two">
    <div><label>이름</label><input type="text" id="sName"></div>
    <div><label>시작 시간</label><input type="time" id="sStart"></div>
    <div><label>출발 시간</label><input type="time" id="sDepart"></div>
  </div>
  <div class="row">
    <label>아침 루틴 (한 줄에 하나: "시간 할 일")</label>
    <textarea id="sRoutine"></textarea>
    <div class="help">예) 07:45 아침 먹기 — 시간 순서대로 적어 주세요.</div>
  </div>
  <div class="row">
    <label>요일별 준비물 (쉼표로 나눠 적기)</label>
    <div class="week" id="sWeek"></div>
  </div>
  <div class="row">
    <label>매일 챙길 것</label>
    <input type="text" id="sDaily">
  </div>
  <div class="btns">
    <button class="btn pri" id="saveBtn">저장</button>
    <button class="btn" data-close="setOv">취소</button>
    <button class="btn ghost" id="resetToday">오늘 체크 초기화</button>
  </div>
</div></div>

<script>
(() => {
'use strict';
const KEY = 'morningRoutine_v1';
const API = 'https://pokeapi.co/api/v2/';
const MAX_ID = 1025;
const WD = ['일','월','화','수','목','금','토'];

const DEFAULT = {
  name: 'Nick', start: '07:20', depart: '08:20', wake: false, sound: true,
  routine: [
    {t:'07:20', label:'이불 정리'},
    {t:'07:25', label:'아침 먹기'},
    {t:'07:42', label:'세수·양치'},
    {t:'07:48', label:'교복 입기'},
    {t:'07:55', label:'선크림 바르기'},
    {t:'08:00', label:'오늘의 할 일'}
  ],
  rv: 3,
  weekly: {0:[],1:[],2:['수영복','라이브러리백'],3:['숙제'],4:[],5:[],6:[]},

function load(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  s = s || {};
  s.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), s.settings || {});
  // 루틴 기본값이 바뀌면 한 번만 새 순서로 교체
  if (s.settings.rv !== DEFAULT.rv){
    s.settings.routine = JSON.parse(JSON.stringify(DEFAULT.routine));
    s.settings.start = DEFAULT.start;
    s.settings.rv = DEFAULT.rv;
    if (s.day) { s.day.tasks = {}; s.day.bonus = null; }
  }

  s.history = s.history || []; // 최근 획득 [{id,sh}]

}

/* ── 포켓몬 API ── */
const memCache = {};
async function getPoke(id){
  if (S.dex[id] && S.dex[id].img) return S.dex[id];
  if (memCache[id]) return memCache[id];
  const [p, sp] = await Promise.all([
    fetch(API+'pokemon/'+id).then(r => { if(!r.ok) throw 0; return r.json(); }),
    fetch(API+'pokemon-species/'+id).then(r => { if(!r.ok) throw 0; return r.json(); })
  ]);
  const nm = lang => (sp.names.find(n => n.language.name === lang) || {}).name;
  const art = (p.sprites.other && p.sprites.other['official-artwork']) || {};
  const info = {
    ko: nm('ko') || p.name, en: nm('en') || p.name,
    img: art.front_default || p.sprites.front_default,
    imgS: art.front_shiny || p.sprites.front_shiny || art.front_default,
    types: p.types.map(t => t.type.name),
    leg: !!(sp.is_legendary || sp.is_mythical)
  };
  memCache[id] = info;
  return info;
}
const rand = () => 1 + Math.floor(Math.random()*MAX_ID);

async function catchMon(opts){
  // opts: {shiny}
  let id = rand(), info = null;
  for (let tries = 0; tries < 3 && !info; tries++){
    try { info = await getPoke(id); } catch(e){ id = rand(); }
  }
  if (!info) return null;
  const sh = !!opts.shiny;
  const d = S.dex[id] || Object.assign({c:0, cs:0}, info);
  Object.assign(d, info);
  if (sh) d.cs = (d.cs||0)+1; else d.c = (d.c||0)+1;
  S.dex[id] = d;
  S.history.unshift({id, sh});
  S.history = S.history.slice(0, 60);
  save();
  return {id, sh, info:d};
}
async function recatch(prev){
  let info = null;
  try { info = await getPoke(prev.id); } catch(e){}
  if (!info) return catchMon({shiny:prev.sh});
  const d = S.dex[prev.id] || Object.assign({c:0, cs:0}, info);
  Object.assign(d, info);
  if (prev.sh) d.cs = (d.cs||0)+1; else d.c = (d.c||0)+1;
  S.dex[prev.id] = d;
  S.history.unshift({id:prev.id, sh:prev.sh});
  save();
  return {id:prev.id, sh:prev.sh, info:d};
}
function releaseMon(id, sh){
  const d = S.dex[id]; if (!d) return;
  if (sh) d.cs = Math.max(0,(d.cs||0)-1); else d.c = Math.max(0,(d.c||0)-1);
  if (!d.c && !d.cs) delete S.dex[id];
  const i = S.history.findIndex(h => h.id == id && !!h.sh === !!sh);
  if (i >= 0) S.history.splice(i,1);
}

function renderTasks(){
  const r = S.settings.routine, el = $('tasks'), n = nowMin();
  const doneN = r.filter((_,i) => S.day.tasks[i]).length;
  let curIdx = -1;
  const inWindow = n >= toMin(S.settings.start) - 30 && n < toMin(S.settings.depart) + 30;
  if (inWindow) r.forEach((t,i) => { if (toMin(t.t) <= n) curIdx = i; });
  el.innerHTML = r.map((t,i) => {
    const d = S.day.tasks[i];
    let cls = 'task';
    if (d) cls += ' done';
    else if (i === curIdx) cls += ' now';
    else if (i < curIdx) cls += ' late';
    let st = BALL_SMALL;
    if (d && d.id){
      const m = S.dex[d.id];
      if (m) st = `<img src="${esc(d.sh ? m.imgS : m.img)}" alt="">${d.sh?'<span class="shiny">✨</span>':''}`;
    } else if (d){ st = '<span style="font-size:28px">✔</span>'; }
    const undo = d && !d.pending ? `<span class="undo" data-undo="${i}">↩ 되돌리기</span>` : '';
    return `<div class="${cls}" data-i="${i}" role="button"><span class="tm">${esc(t.t)}</span><span class="nm">${esc(t.label)}</span>${undo}<span class="stamp">${st}</span></div>`;
  }).join('');
  $('taskCount').textContent = `${doneN} / ${r.length}`;

  const ac = $('allclear');
  if (r.length && doneN === r.length){
    ac.classList.add('show');
    const b = S.day.bonus, m = b && S.dex[b.id];
    $('bonusImg').src = m ? m.imgS : '';
    $('bonusImg').style.display = m ? '' : 'none';
    $('bonusTxt').innerHTML = b && b.early
      ? `올클리어! 출발 전에 끝내서 <span style="color:var(--yellow)">✨색이 다른 ${esc(m?m.ko:'')}</span> 보너스 획득!`
      : '올클리어! 오늘 아침 미션 완료 💪';
  } else ac.classList.remove('show');
}

function renderClock(){
  const d = new Date(), st = S.settings;
  $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $('date').innerHTML = `<b>${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일</b><br>${esc(st.name)}의 아침`;
  const n = nowMin(), s = toMin(st.start), e = toMin(st.depart);
  const c = $('count'); c.className = 'hero';
  if (n < s){
    const left = Math.ceil(s - n);
    $('countLbl').textContent = '루틴 시작까지';
    $('countVal').textContent = left >= 60 ? `${Math.floor(left/60)}시간 ${left%60}분` : `${left}분`;
  } else if (n < e){
    const secs = Math.max(0, Math.round((e - n)*60));
    $('countLbl').textContent = `등교까지 (${st.depart} 출발)`;
    $('countVal').textContent = `${Math.floor(secs/60)}:${pad(secs%60)}`;
    c.classList.add(secs <= 300 ? 'hot' : secs <= 900 ? 'warn' : 'ok');
  } else if (n < e + 60){
    $('countLbl').textContent = '출발 시간!';
    $('countVal').textContent = '잘 다녀와 👋';
    c.classList.add('ok');
  } else {
    $('countLbl').textContent = '내일 출발';
    $('countVal').textContent = st.depart;
  }
  checkAlerts(n, s, e);
  // 타임라인
  $('tlRange').textContent = `${st.start} 시작 → ${st.depart} 출발`;

  $('barTask').style.width = (r.length ? doneN / r.length * 100 : 0) + '%';

let busy = false;
$('tasks').addEventListener('click', async ev => {
  if (busy) return;
  // ↩ 되돌리기: 잘못 누른 미션을 체크 전으로
  const u = ev.target.closest('[data-undo]');
  if (u){
    const i = +u.dataset.undo, cur = S.day.tasks[i];
    if (!cur) return;
    if (cur.id){
      releaseMon(cur.id, cur.sh);
      S.day.undone = S.day.undone || {};
      S.day.undone[i] = {id:cur.id, sh:cur.sh}; // 다시 체크하면 같은 포켓몬 (뽑기 다시 하기 방지)
    }
    delete S.day.tasks[i];
    if (S.day.bonus){ if (S.day.bonus.id) releaseMon(S.day.bonus.id, true); S.day.bonus = null; }
    save(); renderAll(); return;
  }
  const b = ev.target.closest('.task'); if (!b) return;
  const i = +b.dataset.i;
  if (S.day.tasks[i]) return; // 이미 한 미션은 '되돌리기' 버튼으로만 취소
  busy = true;
  S.day.tasks[i] = {pending:true}; renderTasks();
  showShaking(); // 공 흔들기 먼저
  const prev = S.day.undone && S.day.undone[i];
  const res = prev ? await recatch(prev) : await catchMon({shiny: Math.random() < 0.05});
  if (prev) delete S.day.undone[i];
  S.day.tasks[i] = res ? {id:res.id, sh:res.sh} : {offline:true};
  save();
  showReveal(res);
  renderAll();
  // 올클리어 보너스
  const r = S.settings.routine;
  if (r.every((_,k) => S.day.tasks[k]) && !S.day.bonus){
    const early = nowMin() < toMin(S.settings.depart);
    if (early){
      const bres = await catchMon({shiny:true});
      if (bres){
        S.day.bonus = {id:bres.id, early:true}; save();
        setTimeout(() => showReveal(bres, '🏆 올클리어 보너스!'), 2600);
      }
    } else { S.day.bonus = {id:0, early:false}; save(); }
    renderAll();
  }
  busy = false;
});

const LAT = -27.4818, LON = 153.0096;
let wxItems = [];
const WX = c => c===0?['☀️','맑음']:c<=2?['🌤','구름 조금']:c===3?['☁️','흐림']:c<=48?['🌫','안개']:c<=57?['🌦','이슬비']:c<=67?['🌧','비']:c<=77?['🌨','눈']:c<=82?['🌧','소나기']:['⛈','뇌우'];
function setSky(c){
  const k = c <= 1 ? 'sun' : c <= 3 ? 'cloud' : c <= 48 ? 'fog' : c >= 95 ? 'storm' : (c >= 71 && c <= 77) ? 'cloud' : 'rain';
  $('sky').className = k;
}
async function loadWeather(){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,weather_code&timezone=Australia%2FBrisbane&forecast_days=1`;
    const j = await fetch(url).then(r => r.json());
    const cur = j.current, dl = j.daily;
    const [ic, txt] = WX(cur.weather_code);
    setSky(cur.weather_code);
    const rain = dl.precipitation_probability_max[0] ?? 0, uv = dl.uv_index_max[0] ?? 0;
    const hi = Math.round(dl.temperature_2m_max[0]), lo = Math.round(dl.temperature_2m_min[0]);
    wxItems = [];
    const tips = [];
    if (rain >= 40){ wxItems.push('우산'); tips.push('☔ 비 올 수 있어요 — 우산 챙기기'); }
    if (uv >= 6){ tips.push('🧢 자외선 강함 — 모자·선크림 꼭'); }
    if (lo <= 14){ wxItems.push('점퍼'); tips.push('🧥 아침에 쌀쌀해요 — 점퍼 챙기기'); }
    if (hi >= 32){ tips.push('🥤 많이 더워요 — 물 자주 마시기'); }
    $('wx').innerHTML = `<div class="wx-main"><div class="wx-ic">${ic}</div><div><div class="wx-t">${Math.round(cur.temperature_2m)}°</div><div class="wx-d">${txt} · 체감 ${Math.round(cur.apparent_temperature)}°</div></div></div>
      <div class="wx-row"><span class="chip">최고 <b>${hi}°</b></span><span class="chip">최저 <b>${lo}°</b></span><span class="chip">비 <b>${rain}%</b></span><span class="chip">자외선 <b>${Math.round(uv)}</b></span></div>
      ${tips.length ? `<div class="wx-row">${tips.map(t => `<span class="chip" style="background:rgba(90,169,255,.14)">${t}</span>`).join('')}</div>` : ''}`;
    const d = new Date(); $('wxUpd').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())} 기준`;
    renderItems();
  } catch(e){
    $('wx').innerHTML = '<div class="empty">날씨를 못 불러왔어요 (인터넷 확인)</div>';
  }
}

/* ── 화면 꺼짐 방지 ── */
let lock = null;
async function wakeOn(){
  if (!('wakeLock' in navigator)){ wakeMsg('bad','이 브라우저는 화면 꺼짐 방지를 지원하지 않아요. 아래 "안드로이드 설정 방법"을 써 주세요.'); return false; }
  try{
    lock = await navigator.wakeLock.request('screen');
    lock.addEventListener('release', () => { lock = null; updWakeUI(); });
    wakeMsg('ok','켜짐 — 이 화면이 열려 있는 동안 꺼지지 않아요.');
    updWakeUI(); return true;
  } catch(e){
    wakeMsg('bad','켜지 못했어요. 화면을 한 번 터치한 뒤 다시 켜 보세요. 계속 안 되면 아래 안드로이드 설정을 써 주세요.');
    updWakeUI(); return false;
  }
}
function wakeOff(){ if (lock){ lock.release(); lock = null; } wakeMsg('', '꺼짐'); updWakeUI(); }
const ANDROID_TIP = '<br><b>안드로이드 설정 방법:</b> 설정 → 디스플레이 → 화면 자동 꺼짐 → 최대 시간. 또는 개발자 옵션 → "충전 중 화면 켜짐 유지".';
function wakeMsg(cls, t){ const el = $('wakeInfo'); el.className = 'wakeinfo ' + cls; el.innerHTML = t + ANDROID_TIP; }
function updWakeUI(){
  const on = S.settings.wake;
  $('wakeSw').classList.toggle('on', on);
  $('wakeBtn').classList.toggle('on', on && !!lock);
}
async function setWake(on){
  S.settings.wake = on; save();
  if (on) await wakeOn(); else wakeOff();
  updWakeUI();
}
$('wakeSw').addEventListener('click', () => setWake(!S.settings.wake));
$('wakeBtn').addEventListener('click', () => setWake(!(S.settings.wake && lock)));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){ if (S.settings.wake && !lock) wakeOn(); ensureDay() ; renderAll(); }
});
// 자동으로 다시 켜기 실패 시, 첫 터치 때 재시도
document.addEventListener('pointerdown', () => { if (S.settings.wake && !lock) wakeOn(); }, {passive:true});

/* ── 소리 알림 ── */
let actx = null;
function audio(){
  try{
    if (!actx){ const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; actx = new A(); }
    if (actx.state === 'suspended') actx.resume();
  } catch(e){ return null; }
  return actx;
}
document.addEventListener('pointerdown', () => audio(), {passive:true}); // 첫 터치에 소리 잠금 해제
const SND = { five:[[784,.22],[988,.22],[1175,.22],[1568,.6]], late:[[659,.32],[523,.5]] };
function tone(seq){
  const c = audio(); if (!c) return;
  let t = c.currentTime + .05;
  for (let rep = 0; rep < 2; rep++){
    seq.forEach(([f,d]) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.4, t+.02); g.gain.exponentialRampToValueAtTime(.001, t+d);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.05);
      t += d * .9;
    });
    t += .35;
  }
}
function say(text){
  try{
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = 1.05;
    speechSynthesis.cancel(); setTimeout(() => speechSynthesis.speak(u), 2200);
  } catch(e){}
}
let toastTimer = null;
function showToast(msg, kind){
  const el = $('toast'); el.textContent = msg; el.className = 'toast ' + kind + ' show';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 10000);
}
$('toast').addEventListener('click', () => $('toast').classList.remove('show'));
function alertKid(kind, msg, speech){
  if (S.settings.sound){ tone(SND[kind]); if (speech) say(speech); }
  showToast(msg, kind);
}
function checkAlerts(n, s, e){
  if (n < s || n >= e) return;
  const al = S.day.al || (S.day.al = {late:{}});
  const r = S.settings.routine;
  if (!al.five && n >= e - 5){
    al.five = true; save();
    alertKid('five', '⏰ 등교 5분 전! 신발 신고 출발 준비', `${S.settings.name}, 등교 5분 전이에요. 출발 준비하세요!`);
    return;
  }
  const newly = [];
  r.forEach((t,i) => { if (!S.day.tasks[i] && toMin(t.t) + 5 <= n && !al.late[i]) newly.push(i); });
  if (newly.length){
    newly.forEach(i => al.late[i] = true); save();
    const next = r.find((t,i) => !S.day.tasks[i]);
    if (next) alertKid('late', `⏩ 미션이 밀렸어요 — 지금: ${next.label}`, `${next.label}, 할 시간이에요!`);
  }
}
function updSoundUI(){ $('soundSw').classList.toggle('on', !!S.settings.sound); }
$('soundSw').addEventListener('click', () => { S.settings.sound = !S.settings.sound; save(); updSoundUI(); });
$('testFive').addEventListener('click', () => { tone(SND.five); say('등교 5분 전이에요. 출발 준비하세요!'); });
$('testLate').addEventListener('click', () => { tone(SND.late); say('양치, 할 시간이에요!'); });

/* ── 전체 화면 ── */
$('fsBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
});

/* ── 설정 ── */
$('setBtn').addEventListener('click', () => {
  const st = S.settings;
  $('sName').value = st.name; $('sStart').value = st.start; $('sDepart').value = st.depart;
  $('sRoutine').value = st.routine.map(r => `${r.t} ${r.label}`).join('\n');
  $('sWeek').innerHTML = [1,2,3,4,5,6,0].map(w => `<span>${WD[w]}</span><input type="text" data-w="${w}" value="${esc((st.weekly[w]||[]).join(', '))}" placeholder="없음">`).join('');
  $('sDaily').value = st.daily.join(', ');
  if (st.wake) wakeMsg(lock ? 'ok' : 'bad', lock ? '켜짐 — 이 화면이 열려 있는 동안 꺼지지 않아요.' : '설정은 켜짐이지만 아직 적용 전이에요. 화면을 터치하면 다시 시도해요.');
  else wakeMsg('', '꺼짐 — 켜 두면 거실에 세워 둬도 화면이 안 꺼져요.');
  updWakeUI(); updSoundUI();
  $('setOv').classList.add('show');
});
const splitList = v => v.split(/[,，、]/).map(x => x.trim()).filter(Boolean);
$('saveBtn').addEventListener('click', () => {
  const st = S.settings;
  const routine = $('sRoutine').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(\d{1,2}):(\d{2})\s+(.+)$/);
    return m ? {t:`${pad(+m[1])}:${m[2]}`, label:m[3].trim()} : null;
  }).filter(Boolean).sort((a,b) => toMin(a.t) - toMin(b.t));
  if (!routine.length){ alert('루틴을 "07:30 세수"처럼 한 줄씩 적어 주세요.'); return; }
  const changed = JSON.stringify(routine) !== JSON.stringify(st.routine);
  st.name = $('sName').value.trim() || 'Nick';
  st.start = $('sStart').value || '07:20';
  st.depart = $('sDepart').value || '08:20';
  st.routine = routine;
  document.querySelectorAll('#sWeek input').forEach(inp => st.weekly[inp.dataset.w] = splitList(inp.value));
  st.daily = splitList($('sDaily').value);
  if (changed){ S.day.tasks = {}; S.day.bonus = null; }
  save(); $('setOv').classList.remove('show'); renderAll();
});
$('resetToday').addEventListener('click', () => {
  if (!confirm('오늘 체크를 모두 지울까요? (이미 받은 포켓몬은 도감에 남아요)')) return;
  S.day = {date:todayStr(new Date()), tasks:{}, items:{}, bonus:null}; save();
  $('setOv').classList.remove('show'); renderAll();
});

/* ── 시작 ── */
ensureDay();
document.title = `${S.settings.name} 아침 루틴`;
renderAll();
loadWeather();
if (S.settings.wake) wakeOn();
setInterval(() => {
  if (ensureDay()){ renderAll(); loadWeather(); }
  renderClock();
}, 1000);
setInterval(renderTasks, 30000);          // 지금 할 미션 표시 갱신
setInterval(loadWeather, 30*60*1000);     // 30분마다 날씨
})();
</script>
